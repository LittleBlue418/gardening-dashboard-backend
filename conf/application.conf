# https://www.playframework.com/documentation/latest/Configuration




# Where the temp-db JSON files are (the API reads and writes them). Tests point this at a copy.
tempdb.dir = "temp-db"
tempdb.dir = ${?TEMPDB_DIR}

# The dashboard runs on another port (python http.server on 8080), so the browser needs CORS to call the API.
play.filters.enabled += "play.filters.cors.CORSFilter"
play.filters.cors {
  allowedOrigins = ["http://localhost:8080", "http://127.0.0.1:8080"]
  allowedHttpMethods = ["GET", "PUT", "DELETE"]
  allowedHttpHeaders = ["X-User-Id", "Content-Type"]
}

# No cookies or sessions: the API identifies the user by a header, so CSRF tokens don't apply.
play.filters.disabled += "play.filters.csrf.CSRFFilter"
